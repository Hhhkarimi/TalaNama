name: Feature request
description: Propose an incremental product improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and source requirements
      description: Explain source, licence, free-tier, provenance, and UI-preservation implications.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
    validations:
      required: true
